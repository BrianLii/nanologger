AWSTemplateFormatVersion: "2010-09-09"
Description: Ephemeral NanoLogger benchmark host managed through SSM.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC containing the benchmark subnet.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet used by the benchmark instance.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Current Amazon Linux 2023 x86-64 AMI from the AWS public parameter.

Resources:
  BenchmarkRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: nanologger

  BenchmarkInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BenchmarkRole

  BenchmarkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; HTTPS egress for SSM and build dependencies.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: HTTPS to AWS APIs and dependency repositories
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: nanologger

  BenchmarkInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: c7i.xlarge
      IamInstanceProfile: !Ref BenchmarkInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref BenchmarkSecurityGroup
          SubnetId: !Ref SubnetId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 16
            VolumeType: gp3
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y cmake gcc-c++ git
          systemctl enable --now amazon-ssm-agent
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-host
        - Key: Project
          Value: nanologger

Outputs:
  InstanceId:
    Description: EC2 instance used by the VS Code remote benchmark task.
    Value: !Ref BenchmarkInstance
